<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميدغارد ستور — لوحة التحكم</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri:wght@700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0c0c14; --bg-secondary: #111118; --bg-card: #191924;
            --accent: #d4a934; --accent-light: #f0cc5b; --accent-glow: rgba(212,169,52,0.25);
            --text-primary: #f2eee4; --text-secondary: #b0a998; --text-muted: #6e6759;
            --border: #2a2a3c; --success: #27ae60; --warning: #f39c12; --error: #e74c3c; --info: #3498db;
        }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.8; min-height: 100vh; }

        .header { background: rgba(12,12,20,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .logo { font-family: 'Amiri', serif; font-size: 1.3rem; font-weight: 700; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
        .logo span { color: var(--text-primary); font-weight: 400; font-size: 0.85rem; }
        .header-actions { display: flex; gap: 1rem; align-items: center; }
        .header-actions a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .header-actions a:hover { color: var(--accent); }
        .export-btn { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: var(--bg-primary); padding: 0.5rem 1.2rem; border-radius: 8px; font-weight: 600; font-size: 0.85rem; border: none; cursor: pointer; transition: all 0.3s; font-family: 'Tajawal', sans-serif; }
        .export-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px var(--accent-glow); }

        .dashboard { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
        .stat-card.new::after { background: var(--info); }
        .stat-card.in-progress::after { background: var(--warning); }
        .stat-card.completed::after { background: var(--success); }
        .stat-card.total::after { background: var(--accent); }
        .stat-card.stock::after { background: #8e44ad; }
        .stat-card .stat-title { font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .stat-card .stat-value { font-size: 2.2rem; font-weight: 800; margin-top: 0.3rem; }
        .stat-card.new .stat-value { color: var(--info); }
        .stat-card.in-progress .stat-value { color: var(--warning); }
        .stat-card.completed .stat-value { color: var(--success); }
        .stat-card.total .stat-value { color: var(--accent); }
        .stat-card.stock .stat-value { color: #8e44ad; }

        /* Stock Section */
        .stock-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 2rem; }
        .stock-header { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); }
        .stock-header h2 { font-size: 1.1rem; font-weight: 700; }
        .stock-reset-btn { background: rgba(142,68,173,0.15); color: #8e44ad; border: 1px solid rgba(142,68,173,0.3); padding: 0.4rem 1rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: 'Tajawal', sans-serif; transition: all 0.3s; }
        .stock-reset-btn:hover { background: rgba(142,68,173,0.25); }
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0; }
        .stock-item { padding: 0.8rem 1.2rem; border-bottom: 1px solid rgba(42,42,60,0.4); border-left: 1px solid rgba(42,42,60,0.4); display: flex; justify-content: space-between; align-items: center; }
        .stock-item:nth-last-child(-n+1) { border-bottom: none; }
        .stock-item-name { font-size: 0.82rem; font-weight: 600; color: var(--text-primary); }
        .stock-item-qty { font-size: 1.1rem; font-weight: 800; min-width: 30px; text-align: center; }
        .stock-item-qty.high { color: var(--success); }
        .stock-item-qty.low { color: var(--warning); }
        .stock-item-qty.zero { color: var(--error); }
        .stock-edit { background: none; border: none; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; padding: 0.2rem 0.5rem; transition: color 0.2s; }
        .stock-edit:hover { color: var(--accent); }

        .filters-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem 1.5rem; }
        .filters-left { display: flex; gap: 0.8rem; flex-wrap: wrap; }
        .filter-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 0.5rem 1.2rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.3s; font-family: 'Tajawal', sans-serif; }
        .filter-btn:hover, .filter-btn.active { background: rgba(212,169,52,0.15); border-color: var(--accent); color: var(--accent); }
        .search-input { background: rgba(12,12,20,0.6); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 1rem; color: var(--text-primary); font-family: 'Tajawal', sans-serif; font-size: 0.9rem; min-width: 220px; transition: border-color 0.3s; direction: rtl; }
        .search-input:focus { outline: none; border-color: var(--accent); }
        .search-input::placeholder { color: var(--text-muted); }

        .requests-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .requests-header { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); }
        .requests-header h2 { font-size: 1.1rem; font-weight: 700; }
        .requests-count { background: rgba(212,169,52,0.15); color: var(--accent); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }

        .request-item { display: grid; grid-template-columns: auto 1fr auto; gap: 1.2rem; padding: 1.2rem 1.5rem; border-bottom: 1px solid rgba(42,42,60,0.5); transition: background 0.2s; align-items: center; cursor: pointer; }
        .request-item:hover { background: rgba(212,169,52,0.03); }
        .request-item:last-child { border-bottom: none; }
        .request-avatar { width: 44px; height: 44px; border-radius: 12px; background: rgba(212,169,52,0.1); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; color: var(--accent); }
        .request-info h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.2rem; }
        .request-meta { display: flex; gap: 1rem; flex-wrap: wrap; }
        .request-meta span { font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 0.3rem; }
        .type-badge { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 6px; background: rgba(212,169,52,0.08); color: var(--text-secondary); font-weight: 500; }

        .status-badge { padding: 0.3rem 0.9rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; transition: all 0.3s; border: none; font-family: 'Tajawal', sans-serif; }
        .status-badge.new { background: rgba(52,152,219,0.15); color: var(--info); }
        .status-badge.in-progress { background: rgba(243,156,18,0.15); color: var(--warning); }
        .status-badge.completed { background: rgba(46,204,113,0.15); color: var(--success); }
        .status-badge.rejected { background: rgba(231,76,60,0.15); color: var(--error); }
        .status-badge:hover { transform: scale(1.05); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center; padding: 2rem; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 600px; max-height: 80vh; overflow-y: auto; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg-card); z-index: 5; border-radius: 20px 20px 0 0; }
        .modal-header h2 { font-size: 1.2rem; font-weight: 700; }
        .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; transition: color 0.3s; line-height: 1; }
        .modal-close:hover { color: var(--error); }
        .modal-body { padding: 2rem; }
        .detail-row { display: flex; justify-content: space-between; padding: 0.8rem 0; border-bottom: 1px solid rgba(42,42,60,0.3); }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; min-width: 120px; }
        .detail-value { text-align: right; font-weight: 600; font-size: 0.9rem; word-break: break-word; max-width: 70%; }
        .detail-value.highlight { color: var(--accent); font-weight: 800; }
        .detail-value.success { color: var(--success); }
        .modal-actions { display: flex; gap: 0.8rem; margin-top: 1.5rem; flex-wrap: wrap; }
        .action-btn { padding: 0.6rem 1.5rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); transition: all 0.3s; font-family: 'Tajawal', sans-serif; }
        .action-btn.mark-progress { background: rgba(243,156,18,0.15); color: var(--warning); border-color: rgba(243,156,18,0.3); }
        .action-btn.mark-complete { background: rgba(46,204,113,0.15); color: var(--success); border-color: rgba(46,204,113,0.3); }
        .action-btn.mark-rejected { background: rgba(231,76,60,0.15); color: var(--error); border-color: rgba(231,76,60,0.3); }
        .action-btn.delete { background: rgba(231,76,60,0.08); color: var(--error); border-color: rgba(231,76,60,0.2); }
        .action-btn:hover { transform: translateY(-1px); }

        .empty-state { text-align: center; padding: 4rem 2rem; }
        .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
        .empty-state h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
        .empty-state p { color: var(--text-secondary); font-size: 0.95rem; }

        .refresh-indicator { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--text-muted); }
        .refresh-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        @media (max-width: 768px) {
            .dashboard { padding: 1rem; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .filters-bar { flex-direction: column; }
            .request-item { grid-template-columns: auto 1fr; }
            .modal { margin: 1rem; }
            .detail-row { flex-direction: column; gap: 0.3rem; }
            .detail-value { text-align: right; max-width: 100%; }
            .stock-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="logo">🔥 ميدغارد <span>لوحة التحكم</span></a>
        <div class="header-actions">
            <div class="refresh-indicator"><span class="refresh-dot"></span> تحديث تلقائي</div>
            <a href="index.html">→ العودة للموقع</a>
            <button class="export-btn" onclick="exportCSV()">📥 تصدير CSV</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="stats-row">
            <div class="stat-card total"><div class="stat-title">إجمالي الطلبات</div><div class="stat-value" id="totalCount">٠</div></div>
            <div class="stat-card new"><div class="stat-title">جديد</div><div class="stat-value" id="newCount">٠</div></div>
            <div class="stat-card in-progress"><div class="stat-title">قيد التنفيذ</div><div class="stat-value" id="progressCount">٠</div></div>
            <div class="stat-card completed"><div class="stat-title">مكتمل</div><div class="stat-value" id="completedCount">٠</div></div>
            <div class="stat-card stock"><div class="stat-title">منتجات نفذت</div><div class="stat-value" id="outOfStockCount">٠</div></div>
        </div>

        <!-- Stock Management -->
        <div class="stock-section">
            <div class="stock-header">
                <h2>📦 المخزون المتبقي</h2>
                <button class="stock-reset-btn" onclick="resetStock()">🔄 إعادة تعيين المخزون</button>
            </div>
            <div class="stock-grid" id="stockGrid"></div>
        </div>

        <div class="filters-bar">
            <div class="filters-left">
                <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">الكل</button>
                <button class="filter-btn" data-filter="new" onclick="setFilter('new', this)">🔵 جديد</button>
                <button class="filter-btn" data-filter="in-progress" onclick="setFilter('in-progress', this)">🟡 قيد التنفيذ</button>
                <button class="filter-btn" data-filter="completed" onclick="setFilter('completed', this)">🟢 مكتمل</button>
                <button class="filter-btn" data-filter="rejected" onclick="setFilter('rejected', this)">🔴 مرفوض</button>
            </div>
            <input type="text" class="search-input" placeholder="ابحث بالاسم، الهاتف، الولاعة..." oninput="handleSearch(this.value)">
        </div>

        <div class="requests-container">
            <div class="requests-header">
                <h2>طلبات الزبائن</h2>
                <span class="requests-count" id="visibleCount">٠ معروضة</span>
            </div>
            <div id="requestsList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>تفاصيل الطلب</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
    var currentFilter = 'all';
    var currentSearch = '';

    var statusLabels = { 'new': 'جديد', 'in-progress': 'قيد التنفيذ', 'completed': 'مكتمل', 'rejected': 'مرفوض' };
    var statusIcons = { 'new': '🔵', 'in-progress': '🟡', 'completed': '🟢', 'rejected': '🔴' };

    var STOCK_LABELS = {
        'che_d1_gold': 'تشي تصميم ١ ذهبي', 'che_d1_silver': 'تشي تصميم ١ فضي',
        'che_d2_gold': 'تشي تصميم ٢ ذهبي', 'che_d2_silver': 'تشي تصميم ٢ فضي',
        'che_d3_gold': 'تشي تصميم ٣ ذهبي', 'che_d3_silver': 'تشي تصميم ٣ فضي',
        'che_d4_gold': 'تشي تصميم ٤ ذهبي', 'che_d4_silver': 'تشي تصميم ٤ فضي',
        'poker_gold': 'بوكر ذهبي', 'poker_silver': 'بوكر فضي',
        'bmw_gold': 'بي ام ذهبي', 'bmw_silver': 'بي ام فضي',
        'mercedes_gold': 'مرسيدس ذهبي', 'mercedes_silver': 'مرسيدس فضي'
    };
    var INITIAL_STOCK = {
        'che_d1_gold': 2, 'che_d1_silver': 1,
        'che_d2_gold': 2, 'che_d2_silver': 2,
        'che_d3_gold': 2, 'che_d3_silver': 3,
        'che_d4_gold': 2, 'che_d4_silver': 3,
        'poker_gold': 5, 'poker_silver': 3,
        'bmw_gold': 3, 'bmw_silver': 3,
        'mercedes_gold': 4, 'mercedes_silver': 5
    };

    function toAr(num) {
        var digits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
        return String(num).replace(/[0-9]/g, function(d) { return digits[parseInt(d)]; });
    }
    function formatPrice(num) { return toAr(num.toLocaleString('en')) + ' د.ع'; }

    function getOrders() { return JSON.parse(localStorage.getItem('midguard_orders') || '[]'); }
    function saveOrders(orders) { localStorage.setItem('midguard_orders', JSON.stringify(orders)); }

    function getStock() {
        var saved = localStorage.getItem('midguard_stock');
        if (saved) { try { return JSON.parse(saved); } catch(e) {} }
        var stock = JSON.parse(JSON.stringify(INITIAL_STOCK));
        var orders = getOrders();
        orders.forEach(function(o) {
            if (o.items) {
                o.items.forEach(function(it) {
                    var key = it.lighter_id;
                    if (key === 'bmw') key = 'bmw_' + (it.lighter_color || 'silver');
                    if (key === 'mercedes') key = 'mercedes_' + (it.lighter_color || 'silver');
                    if (stock[key] !== undefined) stock[key] = Math.max(0, stock[key] - parseInt(it.quantity));
                });
            }
        });
        localStorage.setItem('midguard_stock', JSON.stringify(stock));
        return stock;
    }
    function saveStock(stock) { localStorage.setItem('midguard_stock', JSON.stringify(stock)); }

    function resetStock() {
        if (!confirm('هل أنت متأكد من إعادة تعيين المخزون للقيم الأولية؟\n(لن يؤثر هذا على الطلبات المسجلة)')) return;
        localStorage.removeItem('midguard_stock');
        /* Recalculate from scratch */
        var stock = JSON.parse(JSON.stringify(INITIAL_STOCK));
        var orders = getOrders();
        orders.forEach(function(o) {
            if (o.items) {
                o.items.forEach(function(it) {
                    var key = it.lighter_id;
                    if (key === 'bmw') key = 'bmw_' + (it.lighter_color || 'silver');
                    if (key === 'mercedes') key = 'mercedes_' + (it.lighter_color || 'silver');
                    if (stock[key] !== undefined) stock[key] = Math.max(0, stock[key] - parseInt(it.quantity));
                });
            }
        });
        saveStock(stock);
        renderStock();
        updateStats();
    }

    function editStockQty(key) {
        var stock = getStock();
        var current = stock[key];
        var input = prompt('أدخل الكمية الجديدة لـ ' + (STOCK_LABELS[key] || key) + ':', current);
        if (input === null) return;
        var newQty = parseInt(input);
        if (isNaN(newQty) || newQty < 0) { alert('يرجى إدخال رقم صحيح غير سالب'); return; }
        stock[key] = newQty;
        saveStock(stock);
        renderStock();
        updateStats();
    }

    function renderStock() {
        var stock = getStock();
        var grid = document.getElementById('stockGrid');
        var outOfStock = 0;
        grid.innerHTML = Object.keys(INITIAL_STOCK).map(function(key) {
            var qty = stock[key] || 0;
            var label = STOCK_LABELS[key] || key;
            var cls = qty === 0 ? 'zero' : qty <= 2 ? 'low' : 'high';
            if (qty === 0) outOfStock++;
            return '<div class="stock-item">' +
                '<span class="stock-item-name">' + label + '</span>' +
                '<span class="stock-item-qty ' + cls + '">' + toAr(qty) + '</span>' +
                '<button class="stock-edit" onclick="editStockQty(\'' + key + '\')" title="تعديل">✏️</button>' +
                '</div>';
        }).join('');
        document.getElementById('outOfStockCount').textContent = toAr(outOfStock);
    }

    function updateStats() {
        var orders = getOrders();
        document.getElementById('totalCount').textContent = toAr(orders.length);
        document.getElementById('newCount').textContent = toAr(orders.filter(function(r) { return r.status === 'new'; }).length);
        document.getElementById('progressCount').textContent = toAr(orders.filter(function(r) { return r.status === 'in-progress'; }).length);
        document.getElementById('completedCount').textContent = toAr(orders.filter(function(r) { return r.status === 'completed'; }).length);
    }

    function escapeHtml(str) { var div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

    function renderRequests() {
        var orders = getOrders();
        var filtered = orders;
        if (currentFilter !== 'all') { filtered = filtered.filter(function(r) { return r.status === currentFilter; }); }
        if (currentSearch) {
            var q = currentSearch.toLowerCase();
            filtered = filtered.filter(function(r) {
                var searchFields = [r.name, r.phone, r.city, r.area];
                if (r.items) { r.items.forEach(function(it) { searchFields.push(it.lighter_name, it.lighter_color || ''); }); }
                else { searchFields.push(r.lighter_name || '', r.lighter_color || ''); }
                return searchFields.some(function(f) { return f.toLowerCase().includes(q); });
            });
        }
        document.getElementById('visibleCount').textContent = toAr(filtered.length) + ' معروضة';
        var list = document.getElementById('requestsList');
        if (filtered.length === 0) {
            list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><h3>' + (currentFilter === 'all' && !currentSearch ? 'لا توجد طلبات بعد' : 'لا توجد نتائج') + '</h3><p>' + (currentFilter === 'all' && !currentSearch ? 'عندما يطلب الزبون من موقعك، تظهر الطلبات هنا تلقائياً' : 'جرّب تعديل الفلتر أو كلمة البحث') + '</p></div>';
            return;
        }
        list.innerHTML = filtered.map(function(r) {
            var itemsSummary = r.items ? r.items.map(function(it) {
                var c = it.lighter_color ? ' (' + it.lighter_color + ')' : '';
                return escapeHtml(it.lighter_name) + c + ' ×' + it.quantity;
            }).join(' + ') : (escapeHtml(r.lighter_name || '') + (r.lighter_color ? ' (' + r.lighter_color + ')' : '') + ' ×' + (r.quantity || 1));
            return '<div class="request-item" onclick="openModal(' + r.id + ')">' +
                '<div class="request-avatar">' + r.name.charAt(0) + '</div>' +
                '<div class="request-info"><h3>' + itemsSummary + '</h3>' +
                '<div class="request-meta">' +
                '<span>👤 ' + escapeHtml(r.name) + '</span>' +
                '<span>📞 ' + escapeHtml(r.phone) + '</span>' +
                '<span class="type-badge">📍 ' + escapeHtml(r.city) + ' / ' + escapeHtml(r.area) + '</span>' +
                '<span>💰 ' + formatPrice(r.total_price) + '</span>' +
                '<span>📅 ' + r.date + '</span>' +
                '</div></div>' +
                '<button class="status-badge ' + r.status + '" onclick="event.stopPropagation(); cycleStatus(' + r.id + ')">' + statusIcons[r.status] + ' ' + statusLabels[r.status] + '</button>' +
                '</div>';
        }).join('');
    }

    function setFilter(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        renderRequests();
    }
    function handleSearch(query) { currentSearch = query; renderRequests(); }

    function cycleStatus(id) {
        var orders = getOrders();
        var idx = orders.findIndex(function(r) { return r.id === id; });
        if (idx === -1) return;
        var statusOrder = ['new', 'in-progress', 'completed', 'rejected'];
        var currentIdx = statusOrder.indexOf(orders[idx].status);
        orders[idx].status = statusOrder[(currentIdx + 1) % statusOrder.length];
        saveOrders(orders); updateStats(); renderRequests();
    }

    function openModal(id) {
        var orders = getOrders();
        var r = orders.find(function(o) { return o.id === id; });
        if (!r) return;
        var body = document.getElementById('modalBody');
        var itemsHtml = '';
        if (r.items && r.items.length > 0) {
            itemsHtml = '<div class="detail-section"><div class="detail-label" style="margin-bottom:8px">🛒 الولاعات</div>' +
                r.items.map(function(it) {
                    var colorLabel = it.lighter_color ? ' — ' + escapeHtml(it.lighter_color) : '';
                    var typeLabel = it.lighter_type ? ' (' + (it.lighter_type === 'premium' ? 'مميزة' : 'عادية') + ')' : '';
                    return '<div class="detail-row" style="border-bottom:1px dashed rgba(255,255,255,0.08);padding:6px 0">' +
                        (it.lighter_img ? '<img src="' + it.lighter_img + '" style="width:40px;height:40px;border-radius:8px;margin-left:8px;vertical-align:middle">' : '') +
                        '<span style="flex:1">' + escapeHtml(it.lighter_name) + colorLabel + typeLabel + '</span>' +
                        '<span style="margin:0 12px">×' + it.quantity + '</span>' +
                        '<span class="detail-value">' + formatPrice(it.line_price) + '</span>' +
                        '</div>';
                }).join('') + '</div>';
        } else {
            itemsHtml =
                '<div class="detail-row"><span class="detail-label">الولاعة</span><span class="detail-value">' + escapeHtml(r.lighter_name || '') + '</span></div>' +
                (r.lighter_color ? '<div class="detail-row"><span class="detail-label">اللون</span><span class="detail-value">' + escapeHtml(r.lighter_color) + '</span></div>' : '') +
                '<div class="detail-row"><span class="detail-label">الكمية</span><span class="detail-value">' + toAr(r.quantity || 1) + ' ولاّعة</span></div>';
        }
        var deliveryLabel = r.city === 'بغداد' ? 'بغداد (٤,٠٠٠ د.ع)' : 'محافظة أخرى (٤,٥٠٠ د.ع)';
        body.innerHTML =
            itemsHtml +
            (r.regular_qty ? '<div class="detail-row"><span class="detail-label">عادية (' + toAr(r.regular_qty) + ')</span><span class="detail-value">' + formatPrice(r.regular_total) + '</span></div>' : '') +
            (r.premium_qty ? '<div class="detail-row"><span class="detail-label">مميزة (' + toAr(r.premium_qty) + ')</span><span class="detail-value">' + formatPrice(r.premium_total) + '</span></div>' : '') +
            '<div class="detail-row"><span class="detail-label">إجمالي الولاّعات</span><span class="detail-value">' + formatPrice(r.subtotal || r.total_price) + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">🚚 التوصيل</span><span class="detail-value success">' + (r.delivery_fee ? formatPrice(r.delivery_fee) + ' (' + deliveryLabel + ')' : '—') + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">المجموع الكلي</span><span class="detail-value highlight">' + formatPrice(r.total_price) + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">الاسم</span><span class="detail-value">' + escapeHtml(r.name) + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">الهاتف</span><span class="detail-value"><a href="tel:' + r.phone + '" style="color:var(--accent)">' + escapeHtml(r.phone) + '</a></span></div>' +
            '<div class="detail-row"><span class="detail-label">المحافظة</span><span class="detail-value">' + escapeHtml(r.city) + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">المنطقة</span><span class="detail-value">' + escapeHtml(r.area) + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">تاريخ الطلب</span><span class="detail-value">' + r.date + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">الحالة</span><span class="detail-value"><button class="status-badge ' + r.status + '" onclick="cycleStatus(' + r.id + '); openModal(' + r.id + ')">' + statusIcons[r.status] + ' ' + statusLabels[r.status] + '</button></span></div>' +
            '<div class="modal-actions">' +
            '<button class="action-btn mark-progress" onclick="setStatus(' + r.id + ',\'in-progress\')">🟡 قيد التنفيذ</button>' +
            '<button class="action-btn mark-complete" onclick="setStatus(' + r.id + ',\'completed\')">🟢 مكتمل</button>' +
            '<button class="action-btn mark-rejected" onclick="setStatus(' + r.id + ',\'rejected\')">🔴 مرفوض</button>' +
            '<button class="action-btn delete" onclick="deleteOrder(' + r.id + ')">🗑️ حذف</button>' +
            '</div>';
        document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
    document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

    function setStatus(id, status) {
        var orders = getOrders();
        var idx = orders.findIndex(function(r) { return r.id === id; });
        if (idx !== -1) { orders[idx].status = status; saveOrders(orders); updateStats(); renderRequests(); openModal(id); }
    }

    function deleteOrder(id) {
        if (!confirm('هل أنت متأكد من حذف هذا الطلب؟')) return;
        var orders = getOrders().filter(function(r) { return r.id !== id; });
        saveOrders(orders); updateStats(); renderRequests(); closeModal();
        /* Recalculate stock */
        localStorage.removeItem('midguard_stock');
        renderStock();
    }

    function exportCSV() {
        var orders = getOrders();
        if (orders.length === 0) { alert('لا توجد طلبات للتصدير.'); return; }
        var headers = ['المعرف','الولاعات','عادية','مميزة','سعر العادي','سعر المميز','إجمالي الولاعات','التوصيل','المجموع الكلي','الاسم','الهاتف','المحافظة','المنطقة','التاريخ','الحالة'];
        var rows = orders.map(function(r) {
            var itemsSummary;
            if (r.items && r.items.length > 0) {
                itemsSummary = r.items.map(function(it) {
                    var c = it.lighter_color ? ' (' + it.lighter_color + ')' : '';
                    return it.lighter_name + c + ' x' + it.quantity;
                }).join(' + ');
            } else {
                itemsSummary = (r.lighter_name || '') + (r.lighter_color ? ' (' + r.lighter_color + ')' : '') + ' x' + (r.quantity || 1);
            }
            return [r.id, '"' + itemsSummary.replace(/"/g, '""') + '"', r.regular_qty || 0, r.premium_qty || 0, r.regular_total || 0, r.premium_total || 0, r.subtotal || r.total_price, r.delivery_fee || 0, r.total_price, '"' + r.name.replace(/"/g, '""') + '"', r.phone, r.city, r.area, r.date, statusLabels[r.status]];
        });
        var csv = '\uFEFF' + [headers.join(','), ...rows.map(function(r) { return r.join(','); })].join('\n');
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a'); a.href = url; a.download = 'midguard_orders_' + new Date().toISOString().split('T')[0] + '.csv'; a.click(); URL.revokeObjectURL(url);
    }

    setInterval(function() { updateStats(); renderRequests(); }, 5000);
    window.addEventListener('storage', function(e) {
        if (e.key === 'midguard_orders' || e.key === 'midguard_stock') { updateStats(); renderRequests(); renderStock(); }
    });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

    updateStats();
    renderStock();
    renderRequests();
    </script>
</body>
</html>
